<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha ENAM 2026</title>
  <style>
    :root {
      /* Paleta Base - Dark Mode */
      --bg-primary: #0d1117;       /* Fundo principal da página */
      --bg-secondary: #161b22;     /* Fundo dos cards e contêineres */
      --bg-tertiary: #21262d;      /* Fundo de hover e caixas de código/artigos */
      --border-color: #30363d;     /* Bordas sutis */
      
      /* Cores de Acento (ENAM / FGV) */
      --accent-gold: #d29922;      /* Destaque primário / Jurisprudência */
      --accent-blue: #58a6ff;      /* Links e referências de Lei Seca */
      --accent-green: #238636;     /* Acertos e botões de validação */
      --accent-red: #da3633;       /* Erros e pegadinhas da banca */
      
      /* Tipografia */
      --text-main: #c9d1d9;        /* Texto corrido padrão */
      --text-muted: #8b949e;       /* Subtítulos e metadados */
      --text-highlight: #f0f6fc;   /* Títulos e foco */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Cabeçalho da Trilha */
    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--text-highlight);
      font-size: 1.6rem;
    }

    /* Seletor de Casas / Tabuleiro */
    .tabuleiro-casas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .casa-btn {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .casa-btn:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--accent-blue);
      color: var(--text-highlight);
    }

    .casa-btn.active {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    /* Painel da Casa Ativa */
    .painel-casa {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .secao-titulo {
      font-size: 1.1rem;
      color: var(--text-highlight);
      border-left: 4px solid var(--accent-gold);
      padding-left: 10px;
      margin: 20px 0 10px 0;
    }

    /* Links de Lei Seca e Jurisprudência */
    .link-box {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .link-pill {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .link-pill:hover {
      border-color: var(--accent-blue);
      text-decoration: underline;
    }

    /* Alerta de Pegadinhas FGV */
    .pegadinha-card {
      background-color: rgba(218, 54, 51, 0.1);
      border-left: 4px solid var(--accent-red);
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin: 15px 0;
      font-size: 0.95rem;
    }

    /* Bloco de Questão */
    .questao-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      margin-top: 20px;
    }

    .enunciado {
      color: var(--text-highlight);
      margin-bottom: 15px;
      font-size: 0.95rem;
      text-align: justify;
    }

    .alternativas label {
      display: block;
      padding: 10px 14px;
      margin: 6px 0;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .alternativas label:hover {
      background-color: var(--bg-tertiary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ENAM 2026 | Trilha Estruturada de Estudos</h1>
    </header>

    <div class="tabuleiro-casas" id="seletor-casas">
      <!-- Botões gerados via script ou estáticos -->
    </div>

    <main id="conteudo-casa" class="painel-casa">
      <!-- O conteúdo do arquivo casaX.js será injetado aqui -->
    </main>
  </div>
  <!-- Seus scripts de dados e lógica -->
  <script src="./casas/casa1.js"></script>
  <script src="./casas/casa2.js"></script>
  <!-- <script src="./casas/casa3.js"></script> <-- Quando criar a 3, adicione esta linha uma única vez -->
  
  <script src="./casas/dados.js"></script>
  <script src="./casas/app.js"></script>
</body>
</html>
